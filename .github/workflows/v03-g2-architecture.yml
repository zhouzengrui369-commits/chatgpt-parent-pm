name: v0.3 G2 architecture boundary

on:
  pull_request:
    branches:
      - chatgpt/shared-capability-adoption-r1
    paths:
      - "schemas/ecosystem-v03-architecture-boundary.schema.json"
      - "fixtures/ecosystem-v03/architecture/**"
      - "validators/validate_ecosystem_v03_architecture.py"
      - "validators/tests/test_validate_ecosystem_v03_architecture.py"
      - "work/tasks/2026-08-14-parent-pm-v03-g2-architecture-boundary/**"
      - ".github/workflows/v03-g2-architecture.yml"

permissions:
  contents: read

jobs:
  validate-g2:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Validate positive architecture fixtures
        run: |
          for fixture in fixtures/ecosystem-v03/architecture/positive/*.json; do
            python validators/validate_ecosystem_v03_architecture.py "$fixture"
          done
      - name: Run G2 blocker tests
        run: python -m unittest validators.tests.test_validate_ecosystem_v03_architecture -v
      - name: Check PR patch whitespace
        run: git diff --check "${{ github.event.pull_request.base.sha }}...HEAD"
