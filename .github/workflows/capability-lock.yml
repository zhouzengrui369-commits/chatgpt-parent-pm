name: Shared Capability Lock

on:
  pull_request:
    branches: [main]
    paths:
      - "docs/SHARED_CAPABILITY_ADOPTION.md"
      - "starter-kit/.github/capabilities/**"
      - "validators/validate_capability_lock.py"
      - ".github/workflows/capability-lock.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python validators/validate_capability_lock.py starter-kit/.github/capabilities/CAPABILITY_LOCK.example.json --allow-placeholder
      - run: git diff --check
