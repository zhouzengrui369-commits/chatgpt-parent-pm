name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        run: python -m unittest discover -s validators/tests -v
      - name: Validate reference project
        run: python validators/validate_install.py examples/reference-project
      - name: Validate starter template structure
        run: python validators/validate_install.py starter-kit --allow-placeholder-lock
